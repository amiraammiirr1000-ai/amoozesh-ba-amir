name: Secure AI backend checks

on:
  push:
    branches: [main]
    paths:
      - 'secure-ai-server/**'
      - 'render.yaml'
      - '.github/workflows/ai-backend-check.yml'
  pull_request:
    paths:
      - 'secure-ai-server/**'
      - 'render.yaml'
      - '.github/workflows/ai-backend-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install backend dependencies
        working-directory: secure-ai-server
        run: npm install
      - name: Syntax check
        run: node --check secure-ai-server/server.mjs
      - name: Run security and API tests
        working-directory: secure-ai-server
        run: npm test
